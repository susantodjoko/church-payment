{% if members %}
<ul class="list-group position-absolute w-100 z-3 shadow" id="search-results">
  {% for m in members %}
  <li class="list-group-item list-group-item-action"
      style="cursor:pointer"
      data-member-id="{{ m.pk }}"
      data-member-label="{{ m.full_name }} ({{ m.member_id }}) - {{ m.lingkungan.name }}">
    <strong>{{ m.full_name }}</strong>
    <small class="text-muted ms-2">{{ m.member_id }} — {{ m.lingkungan.name }}</small>
  </li>
  {% endfor %}
</ul>
<script>
document.querySelectorAll('#search-results .list-group-item').forEach(function(el) {
  el.addEventListener('click', function() {
    selectMember(this.dataset.memberId, this.dataset.memberLabel);
  });
});
</script>
{% elif q|length >= 2 %}
<ul class="list-group position-absolute w-100 z-3">
  <li class="list-group-item text-muted">Tidak ditemukan.</li>
</ul>
{% endif %}
