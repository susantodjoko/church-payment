{% if results %}
<ul class="list-group position-absolute w-100" style="z-index:1000;top:100%" id="keluarga-results">
  {% for kk in results %}
  <li class="list-group-item list-group-item-action" style="cursor:pointer"
      data-kk-id="{{ kk.pk }}"
      data-kk-label="{{ kk.kk_number }} — {{ kk.name }}">
    <strong>{{ kk.kk_number }}</strong> — {{ kk.name }}
    <small class="text-muted d-block">{{ kk.lingkungan }}</small>
  </li>
  {% endfor %}
</ul>
<script>
document.querySelectorAll('#keluarga-results .list-group-item').forEach(function(el) {
  el.addEventListener('click', function() {
    selectKeluarga(this.dataset.kkId, this.dataset.kkLabel);
  });
});
</script>
{% elif q|length >= 2 %}
<div class="text-muted small mt-1">KK tidak ditemukan.</div>
{% endif %}
