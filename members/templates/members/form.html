{% extends 'base.html' %}
{% block title %}{{ action }} Anggota{% endblock %}
{% block content %}
<h3>{{ action }} Anggota</h3>
<form method="post" class="mt-3">
  {% csrf_token %}
  <div class="row g-3">
    {% for field in form %}
    <div class="col-md-6">
      <label class="form-label">{{ field.label }}{% if field.field.required %} *{% endif %}</label>
      {{ field }}
      {% if field.errors %}
      <div class="text-danger small">{{ field.errors|join:", " }}</div>
      {% endif %}
    </div>
    {% endfor %}
  </div>
  <div class="mt-4">
    <button type="submit" class="btn btn-primary">Simpan</button>
    <a href="/members/" class="btn btn-outline-secondary ms-2">Batal</a>
  </div>
</form>
{% endblock %}
