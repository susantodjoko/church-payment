{% extends 'base.html' %}
{% load idr_filters %}
{% block title %}Daftar Pembayaran{% endblock %}
{% block content %}
<h3>Daftar Pembayaran</h3>

<ul class="nav nav-tabs mb-3">
  <li class="nav-item">
    <a id="tab-link-belum" class="nav-link {% if tab == 'belum' %}active{% endif %}"
       href="?tab=belum&month={{ month }}&year={{ year }}">Belum Dilaporkan</a>
  </li>
  <li class="nav-item">
    <a id="tab-link-sudah" class="nav-link {% if tab == 'sudah' %}active{% endif %}"
       href="?tab=sudah&month={{ month }}&year={{ year }}">Sudah Dilaporkan</a>
  </li>
</ul>

<div class="row g-2 mb-3 align-items-center"
     hx-get="/payments/"
     hx-trigger="change from:select, change from:input[type=number]"
     hx-target="#payment-table-body"
     hx-indicator="#table-spinner"
     hx-include="[name='month'],[name='year'],[name='payment_type'],[name='wilayah'],[name='lingkungan'],[name='tab']">
  <input type="hidden" name="tab" value="{{ tab }}">
  <div class="col-auto">
    <select name="month" class="form-select">
      {% for m in months %}
      <option value="{{ m }}" {% if m == month %}selected{% endif %}>{{ m }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="col-auto">
    <select name="year" class="form-select">
      {% for y in years %}
      <option value="{{ y }}" {% if y == year %}selected{% endif %}>{{ y }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="col-auto">
    <select name="payment_type" class="form-select">
      <option value="">Pilih Iuran</option>
      {% for pt in payment_types %}
      <option value="{{ pt.pk }}" {% if selected_payment_type == pt.pk|stringformat:"s" %}selected{% endif %}>{{ pt.name }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="col-auto">
    <select name="wilayah" class="form-select">
      <option value="">Semua Wilayah</option>
      {% for w in wilayah_list %}
      <option value="{{ w.pk }}" {% if selected_wilayah == w.pk|stringformat:"s" %}selected{% endif %}>{{ w.name }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="col-auto">
    <select name="lingkungan" class="form-select">
      <option value="">Semua Lingkungan</option>
      {% for l in lingkungan_list %}
      <option value="{{ l.pk }}" {% if selected_lingkungan == l.pk|stringformat:"s" %}selected{% endif %}>{{ l }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="col-auto">
    <a id="reset-btn" href="/payments/?tab={{ tab }}&month={{ month }}&year={{ year }}" class="btn btn-outline-secondary">Reset</a>
  </div>
  <div class="col-auto">
    <span id="table-spinner" class="htmx-indicator spinner-border spinner-border-sm text-secondary" role="status"></span>
  </div>
</div>

<script>
function syncNavLinks() {
  const month = document.querySelector('[name="month"]').value;
  const year = document.querySelector('[name="year"]').value;
  const paymentType = document.querySelector('[name="payment_type"]').value;
  const wilayah = document.querySelector('[name="wilayah"]').value;
  const lingkungan = document.querySelector('[name="lingkungan"]').value;
  const tab = document.querySelector('[name="tab"]').value;

  ['belum', 'sudah'].forEach(function(t) {
    const link = document.getElementById('tab-link-' + t);
    if (!link) return;
    const params = new URLSearchParams({ tab: t, month: month, year: year });
    if (paymentType) params.set('payment_type', paymentType);
    if (wilayah) params.set('wilayah', wilayah);
    if (lingkungan) params.set('lingkungan', lingkungan);
    link.href = '?' + params.toString();
  });

  const resetBtn = document.getElementById('reset-btn');
  if (resetBtn) {
    resetBtn.href = '/payments/?tab=' + tab + '&month=' + month + '&year=' + year;
  }
}

document.querySelectorAll('[name="month"],[name="year"],[name="payment_type"],[name="wilayah"],[name="lingkungan"]').forEach(function(el) {
  el.addEventListener('change', syncNavLinks);
});
syncNavLinks();
</script>

<form method="post" action="/payments/batch-report/" id="batch-form">
  {% csrf_token %}
  <div id="payment-table-body">
    {% include 'payments/partials/payment_table.html' %}
  </div>
</form>
{% endblock %}
